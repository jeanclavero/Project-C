<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project C — Business Dashboard</title>
<style>
  :root {
    --bg-top: #2c2433;
    --bg-bottom: #33292b;
    --card: rgba(62, 48, 56, 0.45);
    --card-solid: #3e3038;
    --border: rgba(179, 157, 219, 0.18);
    --text: #ece5da;
    --muted: #a99a8f;
    --lavender: #b39ddb;
    --brown: #a1887f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: linear-gradient(165deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    padding: 2.5rem 1.25rem 4rem;
    line-height: 1.5;
  }
  .wrap { max-width: 880px; margin: 0 auto; }

  header { margin-bottom: 2.25rem; }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.75rem;
    font-weight: 500;
    letter-spacing: 0.03em;
    color: var(--lavender);
  }
  .subtitle { color: var(--muted); margin-top: 0.45rem; font-size: 0.95rem; }

  .summary {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 1.75rem;
  }
  .summary-card {
    flex: 1 1 170px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.1rem 1rem;
    text-align: center;
    box-shadow: 0 4px 14px rgba(20, 14, 24, 0.25);
  }
  .summary-card .num {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.55rem;
    color: var(--brown);
  }
  .summary-card .lbl { color: var(--muted); font-size: 0.8rem; margin-top: 0.3rem; letter-spacing: 0.04em; }

  .category {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.15rem 1.4rem;
    margin-bottom: 0.85rem;
    box-shadow: 0 3px 10px rgba(20, 14, 24, 0.18);
  }
  .cat-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.6rem;
    gap: 1rem;
  }
  .cat-name { font-weight: 600; font-size: 1rem; letter-spacing: 0.01em; }
  .cat-status { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.06em; white-space: nowrap; }
  .cat-status.active { color: var(--lavender); }
  .bar {
    position: relative;
    height: 14px;
    background: rgba(24, 18, 26, 0.6);
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 7px;
    width: 0;
    transition: width 1.4s cubic-bezier(0.37, 0.8, 0.4, 1);
  }
  .cat-note { color: var(--muted); font-size: 0.82rem; margin-top: 0.5rem; font-style: italic; }

  footer {
    margin-top: 2.25rem;
    color: var(--muted);
    font-size: 0.78rem;
    border-top: 1px solid var(--border);
    padding-top: 1rem;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Project C — Business Dashboard</h1>
    <p class="subtitle">Life bars for each area of the business. 100% = fully set up and running.</p>
  </header>

  <div class="summary">
    <div class="summary-card">
      <div class="num" id="sum-avg">0%</div>
      <div class="lbl">Overall health</div>
    </div>
    <div class="summary-card">
      <div class="num" id="sum-started">0 / 9</div>
      <div class="lbl">Categories started</div>
    </div>
    <div class="summary-card">
      <div class="num" id="sum-empty">9</div>
      <div class="lbl">Not yet set up</div>
    </div>
  </div>

  <div id="categories"></div>

  <footer>Data source: dashboard/index.html — edit the CATEGORIES list to update values. Last updated: <span id="last-updated"></span></footer>
</div>

<script>
  // Edit this list to change the dashboard. value: 0-100.
  const CATEGORIES = [
    { name: "Finance & Accounting",     value: 0,  note: "No bookkeeping, invoicing, or banking set up yet." },
    { name: "Sales & Customers",        value: 0,  note: "No pipeline, CRM, or first customers yet." },
    { name: "Service Delivery",         value: 0,  note: "No offering defined or delivered yet." },
    { name: "Legal & Regulatory",       value: 0,  note: "No legal structure, contracts, or compliance yet." },
    { name: "Operations & Processes",   value: 0,  note: "No repeatable processes defined yet." },
    { name: "Tech & Software",          value: 10, note: "Project C workspace set up with AI assistant tooling." },
    { name: "HR",                       value: 0,  note: "No hiring, contracts, or policies yet." },
    { name: "Marketing & Brand",        value: 0,  note: "No brand, website, or channels yet." },
    { name: "Physical Assets",          value: 0,  note: "No equipment or premises needed yet." },
  ];

  const LAST_UPDATED = "2026-11-02";

  function colorFor(value) {
    if (value <= 0)  return "#5a4a4f";   // deep taupe: dormant
    if (value < 25) return "#b0705c";    // soft terracotta: critical
    if (value < 50) return "#c29860";    // warm caramel: weak
    if (value < 75) return "#a78bba";    // soft violet: healthy
    return "#b39ddb";                   // lavender: strong
  }

  function statusLabel(value) {
    if (value <= 0)  return "NOT SET UP";
    if (value < 25)  return "CRITICAL";
    if (value < 50)  return "WEAK";
    if (value < 75)  return "HEALTHY";
    return "STRONG";
  }

  const container = document.getElementById("categories");
  CATEGORIES.forEach(cat => {
    const el = document.createElement("div");
    el.className = "category";
    el.innerHTML = `
      <div class="cat-head">
        <span class="cat-name">${cat.name}</span>
        <span class="cat-status ${cat.value > 0 ? "active" : ""}">${statusLabel(cat.value)} · ${cat.value}%</span>
      </div>
      <div class="bar"><div class="bar-fill" style="background:${colorFor(cat.value)}"></div></div>
      <div class="cat-note">${cat.note}</div>
    `;
    container.appendChild(el);
    requestAnimationFrame(() => {
      setTimeout(() => { el.querySelector(".bar-fill").style.width = cat.value + "%"; }, 50);
    });
  });

  const avg = Math.round(CATEGORIES.reduce((s, c) => s + c.value, 0) / CATEGORIES.length);
  const started = CATEGORIES.filter(c => c.value > 0).length;
  document.getElementById("sum-avg").textContent = avg + "%";
  document.getElementById("sum-started").textContent = started + " / " + CATEGORIES.length;
  document.getElementById("sum-empty").textContent = CATEGORIES.length - started;
  document.getElementById("last-updated").textContent = LAST_UPDATED;
</script>
</body>
</html>
